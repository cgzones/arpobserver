name: "CodeQL"

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '0 1 * * *'

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ matrix.language }}-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      actions: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'cpp' ]

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}

    - name: Install Dependencies
      run: sudo apt-get install -y asciidoctor build-essential check libevent-dev libmysqlclient-dev libpcap-dev libsqlite3-dev meson pkg-config

    - name: Setup
      run: meson setup build || (cat build/meson-logs/meson-log.txt; exit 1)

    - name: Build
      run: meson compile -C build/

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
